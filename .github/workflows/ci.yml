# Goal: Lint build push image to dockerhub
name: CI

on: 
  push:
    branches: [main]

jobs:
  lint-frontend-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folders: ['frontend','backend']
    steps:
      - name: Checking out Code
        uses: actions/checkout@v3

      # Linting the UI/backend code
      - name: Set up NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.folders }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ./${{ matrix.folders }}
        run: npm ci

      - name: Linting React Code
        working-directory: ./${{ matrix.folders }}
        run: npm run lint

  build-push-image:
    needs: ['lint-frontend-backend']
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folders: ['frontend','backend']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      #  Docker build push of backend code to dockerhub
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_TOKEN}}
      
      - name: Build and push Backend image to DockerHub
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.folders }}
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/abhi-chat-app-${{ matrix.folders }}:latest
